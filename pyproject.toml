[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quenchguard"
version = "0.1.0"
description = "LSTM-based predictive maintenance for MRI magnet quench detection (72h+ early warning)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QuenchGuard Contributors" }]
keywords = ["predictive-maintenance", "lstm", "time-series", "mri", "healthcare"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "torch>=2.2",
    "pyarrow>=15",
    "plotly>=5.18",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "nbformat>=5.9", "nbconvert>=7.16", "nbclient>=0.9", "ipykernel>=6.29"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
