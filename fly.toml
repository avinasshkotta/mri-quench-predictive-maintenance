# Fly.io deployment — one container serves the UI, streaming API and model API.
#
#   fly launch --no-deploy --copy-config   # first time: choose a unique app name
#   fly secrets set OPENAI_API_KEY=sk-...
#   fly deploy
#
# Cost note (2026): no free tier for new orgs; a shared 1 GB machine is about
# $6.70/month always-on. With auto-stop, an idle demo costs only rootfs
# storage, and Fly waives monthly invoices under $5.

app = "quenchguard"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
