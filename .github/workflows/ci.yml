name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  pipeline:
    name: end-to-end pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run pipeline (quick, CPU, no plots)
        run: python scripts/run_pipeline.py --epochs 2 --device cpu --no-plots

      - name: Data quality gates (Bronze → Silver → Gold, check mode)
        run: python scripts/build_medallion.py --check

      - name: Build interactive HTML report
        run: python scripts/build_report.py

      - name: Build serving image
        run: docker build -t quenchguard:ci .

      - name: Smoke-test the API in Docker
        run: |
          docker run -d --name qg -p 8000:8000 quenchguard:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/model-info > /tmp/model-info.json && break
            sleep 2
          done
          test -s /tmp/model-info.json
          curl -sf http://127.0.0.1:8000/health
          python - <<'PY'
          import json, urllib.request
          import numpy as np
          info = json.load(open('/tmp/model-info.json'))
          window = np.zeros((info['seq_len'], info['n_features'])).tolist()
          req = urllib.request.Request(
              'http://127.0.0.1:8000/predict',
              data=json.dumps({'magnet_id': 'ci', 'window': window}).encode(),
              headers={'content-type': 'application/json'})
          body = json.load(urllib.request.urlopen(req))
          assert 0.0 <= body['quench_probability'] <= 1.0, body
          assert len(body['explanation']) == 3, body
          print('predict OK:', body['quench_probability'], 'alert=', body['alert'])
          PY
          docker rm -f qg

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/metrics.json
            reports/threshold_sweep.csv
            reports/training_history.csv
            reports/quenchguard_report.html
          if-no-files-found: error

  notebook:
    name: notebook executes + HTML export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Execute notebook and export HTML
        run: python scripts/build_notebook.py

      - name: Upload notebook HTML export
        uses: actions/upload-artifact@v4
        with:
          name: notebook-export
          path: reports/notebook_export.html
          if-no-files-found: error
